<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a4a2b">
  <title>飲料點餐｜午茶工作台</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="飲料點餐">
  <script defer src="./pwa.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">☕</span>午茶工作台<span class="demo">示範系統</span></div></header>
  <main>
    <div class="pwa-tools"><button id="install-button" class="secondary" type="button" hidden>安裝點餐系統</button><p id="connection-message" class="message" role="status" hidden></p></div>
    <div class="intro"><p class="eyebrow">DRINK ORDER</p><h1>一杯好飲料，<br>讓下午更有精神。</h1><p>選好飲品、甜度與冰塊，送出後就會出現在訂單清單。</p></div>
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><span class="step">01</span><div><h2 id="form-title">飲料點餐</h2><p>請選擇飲品與口味。除備註外，所有欄位皆為必填。</p></div></div>
      <form id="order-form">
        <div class="grid"><label>訂購人<input name="customer_name" autocomplete="name" required maxlength="100" placeholder="例如：陳小明（虛構）"></label><label>飲品<select name="drink" required><option value="" disabled selected>請選擇飲品</option><option>紅茶</option><option>綠茶</option><option>烏龍茶</option><option>奶茶</option><option>珍珠奶茶</option><option>檸檬綠茶</option><option>美式咖啡</option><option>拿鐵</option></select></label></div>
        <fieldset><legend>尺寸</legend><div class="choice-options two"><label><input type="radio" name="size" value="中杯" required checked><span>中杯</span></label><label><input type="radio" name="size" value="大杯"><span>大杯</span></label></div></fieldset>
        <fieldset><legend>甜度</legend><div class="choice-options five"><label><input type="radio" name="sugar" value="無糖" required><span>無糖</span></label><label><input type="radio" name="sugar" value="微糖"><span>微糖</span></label><label><input type="radio" name="sugar" value="半糖" checked><span>半糖</span></label><label><input type="radio" name="sugar" value="少糖"><span>少糖</span></label><label><input type="radio" name="sugar" value="全糖"><span>全糖</span></label></div></fieldset>
        <fieldset><legend>冰塊</legend><div class="choice-options five"><label><input type="radio" name="ice" value="去冰" required><span>去冰</span></label><label><input type="radio" name="ice" value="微冰"><span>微冰</span></label><label><input type="radio" name="ice" value="少冰" checked><span>少冰</span></label><label><input type="radio" name="ice" value="正常冰"><span>正常冰</span></label><label><input type="radio" name="ice" value="熱"><span>熱</span></label></div></fieldset>
        <div class="grid"><label>數量（杯）<input name="quantity" type="number" inputmode="numeric" required min="1" max="20" step="1" value="1"></label><label>備註（選填）<input name="note" maxlength="200" placeholder="例如：珍珠少一點"></label></div>
        <div class="form-footer"><p>此為公開示範，請使用虛構姓名，勿填寫敏感資訊。</p><button id="submit-button" type="submit">送出訂單 <span aria-hidden="true">↗</span></button></div>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
    <section class="panel orders-panel" aria-labelledby="list-title"><div class="list-heading"><div class="section-heading"><span class="step">02</span><div><h2 id="list-title">最近訂單</h2><p>最近 20 筆訂單，依時間由新到舊排列。</p></div></div><button id="refresh-button" class="secondary" type="button">重新整理</button></div><div class="status-filters" role="group" aria-label="依製作狀態篩選訂單"><button type="button" data-status-filter="全部" aria-pressed="true">全部</button><button type="button" data-status-filter="待製作" aria-pressed="false">待製作</button><button type="button" data-status-filter="製作中" aria-pressed="false">製作中</button><button type="button" data-status-filter="已完成" aria-pressed="false">已完成</button></div><p id="cup-total" class="cup-total" hidden></p><p id="list-message" class="message" role="status" aria-live="polite">正在載入訂單…</p><ul id="order-list" class="order-list" aria-label="最近訂單"></ul></section>
    <footer>午茶工作台 <span>／</span> 一杯一杯，準時送達。</footer>
  </main>
</body>
</html>
